<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Limited Daily Planner Exercise</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="morning">
            <h2>My Morning To-Do List</h2>
            <ul>
                <li class="important">Make Breakfast</li>
                <li class="completed">Water my plants</li>
                <li class="important">
                    Walk the dog 
                    <a href="#" class="button">Complete</a>
                </li>
            </ul>
        </div>
        <div id="afternoon">
            <h2>My Afternoon To-Do List</h2>
            <ul>
                <li class="completed">Prepare lunch</li>
                <li class="important">
                    Buy groceries 
                    <a href="#" class="button">Complete</a>
                </li>
                <li class="important">Go to Dentist Appointment</li>
            </ul>
        </div>
        <div id="evening">
            <h2>My Evening To-Do List</h2>
            <ul>
                <li class="important">Prepare dinner</li>
                <li class="completed important">Study for Exam</li>
                <li class="completed">
                    Do laundry 
                    <a href="#" class="button">Complete</a>
                </li>
            </ul>
        </div>
    </body>
</html>
