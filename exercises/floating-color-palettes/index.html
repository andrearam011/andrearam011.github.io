<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palette Exercise</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="color-palette">
            <h2>Dusted Wine</h2>
            <h4 id="p1-c1" class="color">#412234</h4>
            <h4 id="p1-c2" class="color">#6D466B</h4>
            <h4 id="p1-c3" class="color">#EAD7D7</h4>
        </div>
        <div class="color-palette">
            <h2>Italian Beach Cove</h2>
            <h4 id="p2-c1" class="color">#0E7C7B</h4>
            <h4 id="p2-c2" class="color">#D4F4DD</h4>
            <h4 id="p2-c3" class="color">#D62246</h4>
        </div>
        <div class="color-palette">
            <h2>Zombie Dusk</h2>
            <h4 id="p3-c1" class="color">#708B75</h4>
            <h4 id="p3-c2" class="color">#3D315B</h4>
            <h4 id="p3-c3" class="color">#F8F991</h4>
        </div>
    </body>
</html>
