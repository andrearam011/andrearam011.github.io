<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Themed Gallery Page Exercise</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="centered-hero">
            <div class="hero-content">
                <h1>Femme Fatale</h1>
                <p>Men; at the hands of a woman.</p>
            </div>
        </div>
        <div id="layout">
            <div class="horizontal-masonry-gallery">
                <img 
                    src="images/ff-woman.jpg" 
                    alt="Femme Fatale Woman on Piano"
                >
                <img src="images/music.jpg" alt="Vinyl">
                <img src="images/evil-man.jpg" alt="Evil Man">
                <img src="images/train-station.jpg" alt="Train Station Lobby">
                <img src="images/detective.jpg" alt="Detective Studying Case">
                <img src="images/investigation.jpg" alt="Investigation">
                <img src="images/woman-staring.jpg" alt="Woman on Phone">
                <img src="images/lurking.jpg" alt="Detective Lurking">
                <img src="images/typewriter.jpg" alt="Typewriter">
            </div>
        </div>
    </body>
</html>
