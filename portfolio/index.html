<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jim's Portfolio</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
         <nav>
            <a href="#">Photos by Jim</a>
            <a href="#">Gallery</a>
            <a href="#">Services</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <div class="centered-hero">
            <div class="hero-content">
                <div class="text-box">
                    <h1>Photos by Jim</h1>
                    <a href="#gal" class="btn" id="hero">View Gallery</a>
                </div>
            </div>
        </div>
        <div class="layout">
            <h1 class="sub-title" id="gal">Gallery</h1>
            <hr>
            <div class="gallery">
                <img src="images/g1.jpg" alt="Portrait One">
                <img src="images/g2.jpg" alt="Portrait Two">
                <img src="images/g3.jpg" alt="Portrait Three">
                <img src="images/g4.jpg" alt="Portrait Four">
                <img src="images/g5.jpg" alt="Portrait Five">
                <img src="images/g6.jpg" alt="Portrait Six">
                <img src="images/g7.jpg" alt="Portrait Seven">
                <img src="images/g8.jpg" alt="Portrait Eight">
                <img src="images/g9.jpg" alt="Portrait Nine">
            </div> 
            <hr> 
        </div>
        <div class="carousel-container">
                <div class="card-one">
                    <div class="card-content">
                        <h2 class="card-titles">ABOUT</h2>
                    </div>
                    <a href="#" class="card-btn">Learn More</a>
                </div>
                <div class="card-two">
                    <div class="card-content">
                        <h2 class="card-titles">SERVICES</h2>
                    </div>
                    <a href="#" class="card-btn">View Rates</a>
                </div>
                <div class="card-three">
                    <div class="card-content">
                        <h2 class="card-titles">CONTACT</h2>
                    </div>
                    <a href="#" class="card-btn">Reach Out</a>
                </div>
            </div>
    </body>
</html>
